name: bi-ble continuity and editor
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
      - run: pnpm install --frozen-lockfile
      - run: node --test tools/continuity-plan.test.mjs tools/continuity-editor.test.mjs tools/receipt-reconcile.test.mjs
      - run: pnpm editor:lint
      - run: pnpm editor:build
